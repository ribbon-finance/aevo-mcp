[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-aevo-server"
version = "0.2.0"
description = "Model Context Protocol server for AEVO trading"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aevo"}]
keywords = ["mcp", "aevo", "trading", "defi", "perpetuals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "requests>=2.30.0",
  "eth-account>=0.12.2",
  "eth-utils>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/aevo-xyz/mcp-aevo-server"
Documentation = "https://api-docs.aevo.xyz"

[project.scripts]
aevo-mcp = "mcp_aevo_server.server:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "SIM108", # ternary operator (readability preference)
  "SIM105", # contextlib.suppress vs try/except/pass (explicit is fine)
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_aevo_server"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
