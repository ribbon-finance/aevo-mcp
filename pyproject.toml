[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-aevo-server"
version = "0.2.0"
description = "Model Context Protocol server for AEVO trading"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aevo"}]
keywords = ["mcp", "aevo", "trading", "defi", "perpetuals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.30.0",
  "eth-account>=0.12.2",
  "eth-utils>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/aevo-xyz/mcp-aevo-server"
Documentation = "https://api-docs.aevo.xyz"

[project.scripts]
aevo-mcp = "mcp_aevo_server.server:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
